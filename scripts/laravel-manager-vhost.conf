<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "/opt/laravel-manager/public"

    <Directory "/opt/laravel-manager/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/laravel-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/laravel-manager-access.log combined
</VirtualHost>
